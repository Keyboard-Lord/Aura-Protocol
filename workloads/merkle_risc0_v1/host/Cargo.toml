[package]
name = "aura-c3-merkle-host"
version = "0.1.0"
edition = "2021"

[features]
default = []
prove = ["risc0-zkvm/prove"]

[dependencies]
aura_compute_merkle_v1 = { path = "../../../crates/aura_compute_merkle_v1" }
risc0-zkvm = { path = "../vendor/risc0/risc0/zkvm", default-features = false, features = ["std", "disable-dev-mode"] }
risc0-binfmt = { path = "../vendor/risc0/risc0/binfmt" }
risc0-core = { path = "../vendor/risc0/risc0/core", default-features = false }
anyhow = "=1.0.104"
hex = "=0.4.3"
serde_json = "=1.0.151"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
