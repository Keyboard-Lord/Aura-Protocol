[package]
name = "aura_cli_v1"
version = "0.1.0"
edition = "2021"
workspace = "../../legacy/solana"
description = "CLI for the frozen Aura v1 proof-preparation flow"

[[bin]]
name = "aura"
path = "src/main.rs"

[dependencies]
aura_notarization_export_v1 = { path = "../aura_notarization_export_v1" }
aura_notarization_render_v1 = { path = "../aura_notarization_render_v1" }
aura_sdk_v1 = { path = "../aura_sdk_v1" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
aura_submission_client_v1 = { path = "../aura_submission_client_v1" }
