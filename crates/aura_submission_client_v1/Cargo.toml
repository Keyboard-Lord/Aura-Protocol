[package]
name = "aura_submission_client_v1"
version = "0.1.0"
edition = "2021"
workspace = "../../legacy/solana"
description = "Rust client for the frozen Aura v1 submit_proof path"

[dependencies]
aura_sdk_v1 = { path = "../aura_sdk_v1" }
serde = { version = "1", features = ["derive"] }
solana-client = "1.18.26"
solana-sdk = "1.18.26"

[dev-dependencies]
aura_protocol = { path = "../../legacy/solana/program" }
serde_json = "1"
solana-program-test = "1.18.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
