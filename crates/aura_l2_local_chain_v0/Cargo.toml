[package]
name = "aura_l2_local_chain_v0"
version = "0.1.0"
edition = "2021"
description = "Minimal runnable Aura local proving chain v0 with explicit mock proving"

[dependencies]
aura_intent_lineage_v1 = { path = "../aura_intent_lineage_v1" }
aura_l2_execution_v1 = { path = "../aura_l2_execution_v1" }
aura_l2_local_settlement_v1 = { path = "../aura_l2_local_settlement_v1" }
aura_l2_prover_v1 = { path = "../aura_l2_prover_v1" }
aura_l2_public_input_v1 = { path = "../aura_l2_public_input_v1" }
aura_l2_verifier_v1 = { path = "../aura_l2_verifier_v1" }
ed25519-dalek = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "aura_l2_local_chain_v0"
path = "src/main.rs"
