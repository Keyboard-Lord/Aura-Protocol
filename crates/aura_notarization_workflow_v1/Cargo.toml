[package]
name = "aura_notarization_workflow_v1"
version = "0.1.0"
edition = "2021"
description = "High-level summary-to-files workflow facade for the frozen Aura notarization receipt pair"

[dependencies]
aura_notarization_export_v1 = { path = "../aura_notarization_export_v1" }
aura_notarization_export_service_v1 = { path = "../aura_notarization_export_service_v1" }
serde_json = "1"

[dev-dependencies]
aura_notarization_render_v1 = { path = "../aura_notarization_render_v1" }
serde = { version = "1", features = ["derive"] }
