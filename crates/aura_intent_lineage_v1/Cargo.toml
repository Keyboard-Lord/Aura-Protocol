[package]
name = "aura_intent_lineage_v1"
version = "0.1.0"
edition = "2021"
description = "Aura Storm execution, canonical claims and witness verification with explicit legacy boundaries"

[dependencies]
curve25519-dalek = "3.2.1"
ring = "0.17.14"
sha2 = "0.10"
sha3 = "0.10"
unicode-normalization = "0.1"
winterfell = "0.13.1"

[dev-dependencies]
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aura_udot_v2 = { path = "../aura_udot_v2" }
