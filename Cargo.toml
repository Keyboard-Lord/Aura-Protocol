[workspace]
resolver = "2"
members = ["crates/*"]
exclude = [
    "crates/aura_cli_v1",
    "crates/aura_submission_client_v1",
    "crates/aura_reference_demo_v1",
    "legacy/solana",
]
default-members = [
    "crates/aura_bitcoin_v1",
    "crates/aura_sdk_v1",
    "crates/aura_intent_lineage_v1",
]

[workspace.metadata.aura]
canonical_repo_verifier = "scripts/verify_repo_truth.sh"
canonical_active_verifier = "scripts/verify_active_foundation.sh"
canonical_frozen_v1_verifier = "scripts/test_udot_parity.sh"

[profile.dev.package.winter-air]
debug-assertions = false

[profile.dev.package.winter-prover]
debug-assertions = false

[profile.test.package.winter-prover]
debug-assertions = false
