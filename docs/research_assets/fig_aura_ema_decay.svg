<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fcf8f2"/>
      <stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <rect x="40" y="34" width="1320" height="692" rx="26" fill="url(#panel)" stroke="#d8e0eb" stroke-width="2"/>

  <text x="700" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" fill="#132033">
    Figure 2. Exponential decay of input influence under EMA for different decay factors α
  </text>
  <text x="700" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#45556e">
    The EMA runs inside the 20 computational nodes; for any single leaf-origin input, influence at v_out is upper-bounded by r(h, α) = ((1 - α) / 3)^h after h hops.
  </text>

  <rect x="88" y="164" width="1224" height="126" rx="22" fill="#fbf6ed" stroke="#ead7bc" stroke-width="2"/>
  <text x="118" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#6b4b16">
    V_k^(t) = α · S(I_k^(t)) + (1 - α) · (1/3) · Σ    V_j^(t-1)
  </text>
  <text x="649" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#6b4b16">
    j∈N(v_k)
  </text>
  <text x="118" y="274" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#364356">
    Old inputs are forgotten inside the graph itself: suppression after h hops is 1 - ((1 - α) / 3)^h, crossing 99% by the diameter-5 boundary for α ≥ 0.5.
  </text>

  <rect x="88" y="318" width="904" height="356" rx="22" fill="#ffffff" stroke="#d8e0eb" stroke-width="2"/>
  <text x="540" y="364" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#243247">
    Suppression of an older input as it propagates through the 20-node graph toward v_out
  </text>

  <line x1="170" y1="620" x2="906" y2="620" stroke="#6d7a90" stroke-width="3"/>
  <line x1="170" y1="620" x2="170" y2="412" stroke="#6d7a90" stroke-width="3"/>

  <line x1="164" y1="620" x2="170" y2="620" stroke="#6d7a90" stroke-width="2"/>
  <text x="148" y="626" text-anchor="end" font-family="Georgia, serif" font-size="16" fill="#516079">0%</text>
  <line x1="164" y1="568" x2="170" y2="568" stroke="#6d7a90" stroke-width="2"/>
  <text x="148" y="574" text-anchor="end" font-family="Georgia, serif" font-size="16" fill="#516079">25%</text>
  <line x1="164" y1="516" x2="170" y2="516" stroke="#6d7a90" stroke-width="2"/>
  <text x="148" y="522" text-anchor="end" font-family="Georgia, serif" font-size="16" fill="#516079">50%</text>
  <line x1="164" y1="464" x2="170" y2="464" stroke="#6d7a90" stroke-width="2"/>
  <text x="148" y="470" text-anchor="end" font-family="Georgia, serif" font-size="16" fill="#516079">75%</text>
  <line x1="164" y1="412" x2="170" y2="412" stroke="#6d7a90" stroke-width="2"/>
  <text x="148" y="418" text-anchor="end" font-family="Georgia, serif" font-size="16" fill="#516079">100%</text>

  <line x1="170" y1="620" x2="170" y2="626" stroke="#6d7a90" stroke-width="2"/>
  <text x="170" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#516079">0</text>
  <line x1="317" y1="620" x2="317" y2="626" stroke="#6d7a90" stroke-width="2"/>
  <text x="317" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#516079">1</text>
  <line x1="464" y1="620" x2="464" y2="626" stroke="#6d7a90" stroke-width="2"/>
  <text x="464" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#516079">2</text>
  <line x1="611" y1="620" x2="611" y2="626" stroke="#6d7a90" stroke-width="2"/>
  <text x="611" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#516079">3</text>
  <line x1="758" y1="620" x2="758" y2="626" stroke="#6d7a90" stroke-width="2"/>
  <text x="758" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#516079">4</text>
  <line x1="905" y1="620" x2="905" y2="626" stroke="#6d7a90" stroke-width="2"/>
  <text x="905" y="650" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#516079">5</text>
  <text x="540" y="692" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4d5d74">hop count h</text>
  <text x="86" y="516" transform="rotate(-90 86 516)" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#4d5d74">suppression of older input</text>

  <line x1="905" y1="412" x2="905" y2="620" stroke="#bfc8d5" stroke-dasharray="8 8" stroke-width="2"/>
  <text x="905" y="396" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#5e6d82">diameter D = 5</text>

  <polyline points="170,620 317,446.7 464,417.8 611,412.96 758,412.16 905,412.03" fill="none" stroke="#d86a1d" stroke-width="5"/>
  <circle cx="170" cy="620" r="6" fill="#d86a1d"/>
  <circle cx="317" cy="446.7" r="6" fill="#d86a1d"/>
  <circle cx="464" cy="417.8" r="6" fill="#d86a1d"/>
  <circle cx="611" cy="412.96" r="6" fill="#d86a1d"/>
  <circle cx="758" cy="412.16" r="6" fill="#d86a1d"/>
  <circle cx="905" cy="412.03" r="6" fill="#d86a1d"/>

  <polyline points="170,620 317,429.3 464,413.43 611,412.12 758,412.01 905,412.00" fill="none" stroke="#1e6fb8" stroke-width="5"/>
  <circle cx="170" cy="620" r="6" fill="#1e6fb8"/>
  <circle cx="317" cy="429.3" r="6" fill="#1e6fb8"/>
  <circle cx="464" cy="413.43" r="6" fill="#1e6fb8"/>
  <circle cx="611" cy="412.12" r="6" fill="#1e6fb8"/>
  <circle cx="758" cy="412.01" r="6" fill="#1e6fb8"/>
  <circle cx="905" cy="412.00" r="6" fill="#1e6fb8"/>

  <polyline points="170,620 317,418.9 464,412.23 611,412.01 758,412.00 905,412.00" fill="none" stroke="#2f855a" stroke-width="5"/>
  <circle cx="170" cy="620" r="6" fill="#2f855a"/>
  <circle cx="317" cy="418.9" r="6" fill="#2f855a"/>
  <circle cx="464" cy="412.23" r="6" fill="#2f855a"/>
  <circle cx="611" cy="412.01" r="6" fill="#2f855a"/>
  <circle cx="758" cy="412.00" r="6" fill="#2f855a"/>
  <circle cx="905" cy="412.00" r="6" fill="#2f855a"/>

  <rect x="1022" y="318" width="290" height="356" rx="22" fill="#f5f8fc" stroke="#d8e0eb" stroke-width="2"/>
  <text x="1167" y="364" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#243247">
    Diameter-5 summary
  </text>

  <line x1="1058" y1="414" x2="1098" y2="414" stroke="#d86a1d" stroke-width="5"/>
  <circle cx="1078" cy="414" r="6" fill="#d86a1d"/>
  <text x="1124" y="420" font-family="Georgia, serif" font-size="20" fill="#243247">α = 0.50</text>
  <text x="1124" y="446" font-family="Georgia, serif" font-size="17" fill="#4d5d74">remaining: 0.0129%</text>
  <text x="1124" y="470" font-family="Georgia, serif" font-size="17" fill="#4d5d74">suppressed: 99.9871%</text>

  <line x1="1058" y1="520" x2="1098" y2="520" stroke="#1e6fb8" stroke-width="5"/>
  <circle cx="1078" cy="520" r="6" fill="#1e6fb8"/>
  <text x="1124" y="526" font-family="Georgia, serif" font-size="20" fill="#243247">α = 0.75</text>
  <text x="1124" y="552" font-family="Georgia, serif" font-size="17" fill="#4d5d74">remaining: 0.0004%</text>
  <text x="1124" y="576" font-family="Georgia, serif" font-size="17" fill="#4d5d74">suppressed: 99.9996%</text>

  <line x1="1058" y1="626" x2="1098" y2="626" stroke="#2f855a" stroke-width="5"/>
  <circle cx="1078" cy="626" r="6" fill="#2f855a"/>
  <text x="1124" y="632" font-family="Georgia, serif" font-size="20" fill="#243247">α = 0.90</text>
  <text x="1124" y="658" font-family="Georgia, serif" font-size="17" fill="#4d5d74">remaining: 0.000004%</text>
  <text x="1124" y="682" font-family="Georgia, serif" font-size="17" fill="#4d5d74">suppressed: 99.999996%</text>

  <text x="1167" y="714" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#4d5d74">
    Fresh shards injected at every node further accelerate convergence beyond this single-input upper bound.
  </text>
</svg>
